name: Tests

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
      - run: gem install rubocop
      - run: rubocop

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # An unofficial mirror of the engine's executable, enough to run tests.
      # The engine lands in the workspace, beside mygame/, as bin/test expects.
      - uses: kfischer-okarin/download-dragonruby@v1
        with:
          version: latest
      - name: Run the tests
        run: bin/test
