# Lets a game take this library as a dependency with drenv
# (https://github.com/Nitemaeric/drenv): `drenv add github:jmonteiro/dragonruby-vfx -n vfx`.
[package]
name = "vfx"
version = "0.1.0"
root = "mygame/lib"     # only the library, with its pictures, is vendored
entrypoint = "vfx.rb"   # requires every effect
